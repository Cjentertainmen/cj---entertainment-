<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CJ Entertainment Admin</title>

<link rel="stylesheet" href="style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#d40000;
color:white;
text-align:center;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:20px;
}

input,
textarea,
select{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
padding:12px 20px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

.publish{
background:#d40000;
color:white;
width:100%;
}

.news-item{
background:#fafafa;
padding:15px;
border-radius:10px;
margin-top:15px;
border:1px solid #ddd;
}

.news-item img{
width:100%;
border-radius:10px;
margin-bottom:10px;
}

.edit{
background:orange;
color:white;
margin-right:10px;
}

.delete{
background:#e91e63;
color:white;
}

#message{
font-weight:bold;
margin-top:15px;
}

</style>

</head>

<body>

<header>

<h1>🛠️ CJ Entertainment Admin Panel</h1>

<p>Publish • Edit • Delete News</p>

</header>

<div class="container">

<div class="card">

<h2>Publish News</h2>

<input
type="text"
id="title"
placeholder="News Title">

<textarea
id="description"
rows="6"
placeholder="News Description"></textarea>

<input
type="text"
id="video"
placeholder="YouTube Video Link (Optional)">

<input
type="file"
id="imageFile"
accept="image/*">

<select id="category">

<option value="News">📰 News</option>

<option value="Music">🎵 Music</option>

<option value="Comedy">😂 Comedy</option>

<option value="Sports">⚽ Sports</option>

</select>

<button
id="publishBtn"
class="publish">

Publish News

</button>

<p id="message"></p>

</div>

<div class="card">

<h2>Published News</h2>

<div id="newsList">

Loading...

</div>

</div>

</div>
  <script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
updateDoc,
doc
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyAaUKbyTseplQ47ntY5OxXiiN2Pwmdq5uQ",

authDomain:"cj-entertainment-babc7.firebaseapp.com",

projectId:"cj-entertainment-babc7",

storageBucket:"cj-entertainment-babc7.firebasestorage.app",

messagingSenderId:"724552137010",

appId:"1:724552137010:web:bd5b4c927e59dd2394ff2b"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

onAuthStateChanged(auth,(user)=>{

if(!user){

window.location.href="login.html";

}

});

document.getElementById("publishBtn").addEventListener("click",async()=>{

const title=document.getElementById("title").value.trim();
const description=document.getElementById("description").value.trim();
const video=document.getElementById("video").value.trim();
const category=document.getElementById("category").value;
const file=document.getElementById("imageFile").files[0];

if(!title || !description || !file){

document.getElementById("message").innerHTML="❌ Please complete all required fields.";

return;

}

document.getElementById("message").innerHTML="Uploading image...";

const formData=new FormData();

formData.append("file",file);
formData.append("upload_preset","cjnews");

const upload=await fetch(
"https://api.cloudinary.com/v1_1/kvczllar/image/upload",
{
method:"POST",
body:formData
}
);

const imageData=await upload.json();
const image=imageData.secure_url;

await addDoc(collection(db,"news"),{

title,
description,
video,
image,
category,
likes:0,
createdAt:new Date()

});

document.getElementById("message").innerHTML="✅ News Published Successfully!";

document.getElementById("title").value="";
document.getElementById("description").value="";
document.getElementById("video").value="";
document.getElementById("imageFile").value="";

});
async function loadNews(){

const newsList=document.getElementById("newsList");

newsList.innerHTML="";

const snapshot=await getDocs(collection(db,"news"));

snapshot.forEach((item)=>{

const news=item.data();
const id=item.id;

newsList.innerHTML+=`

<div class="news-item">

<img src="${news.image}" alt="News">

<h3>${news.title}</h3>

<p><strong>Category:</strong> ${news.category}</p>

<p>${news.description}</p>

<button class="edit" onclick="editNews('${id}','${news.title}','${news.description}')">
Edit
</button>

<button class="delete" onclick="deleteNews('${id}')">
Delete
</button>

</div>

`;

});

}

window.deleteNews=async(id)=>{

if(confirm("Delete this news?")){

await deleteDoc(doc(db,"news",id));

loadNews();

}

};

window.editNews=async(id,title,description)=>{

const newTitle=prompt("Edit title",title);

const newDescription=prompt("Edit description",description);

if(newTitle && newDescription){

await updateDoc(doc(db,"news",id),{

title:newTitle,

description:newDescription

});

loadNews();

}

};

loadNews();

</script>

</body>
</html>
