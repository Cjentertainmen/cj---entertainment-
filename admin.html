<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CJ Entertainment Admin</title>

<link rel="stylesheet" href="style.css">

<style>
input, textarea, button{
width:100%;
padding:12px;
margin:10px 0;
font-size:16px;
border-radius:8px;
}

button{
background:#d40000;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#900000;
}
</style>

</head>

<body>

<header>
<h1>🛠️ CJ Entertainment Admin</h1>
<p>Publish Latest News</p>
</header>

<section class="news">

<input type="text" id="title" placeholder="News Title">

<textarea id="description" rows="6" placeholder="News Description"></textarea>

<input type="text" id="video" placeholder="YouTube Video Link">

<input type="file" id="imageFile" accept="image/*">

<button id="publishBtn">
Publish News
</button>

<p id="message"></p>

</section>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {
getFirestore,
collection,
addDoc
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

const firebaseConfig = {

apiKey:"AIzaSyAaUKbyTseplQ47ntY5OxXiiN2Pwmdq5uQ",

authDomain:"cj-entertainment-babc7.firebaseapp.com",

projectId:"cj-entertainment-babc7",

storageBucket:"cj-entertainment-babc7.firebasestorage.app",

messagingSenderId:"724552137010",

appId:"1:724552137010:web:bd5b4c927e59dd2394ff2b"

};

const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

const auth=getAuth(app);

onAuthStateChanged(auth,(user)=>{

if(!user){

window.location.href="login.html";

}

});

document.getElementById("publishBtn").addEventListener("click",async()=>{

const title=document.getElementById("title").value;

const description=document.getElementById("description").value;

const video=document.getElementById("video").value;

const file=document.getElementById("imageFile").files[0];

if(!title||!description||!file){

document.getElementById("message").innerHTML="Please complete all fields.";

return;

}

document.getElementById("message").innerHTML="Uploading image...";

const formData=new FormData();

formData.append("file",file);

formData.append("upload_preset","cjnews");

const upload=await fetch(

"https://api.cloudinary.com/v1_1/kvczllar/image/upload",

{

method:"POST",

body:formData

}

);

const imageData=await upload.json();

const image=imageData.secure_url;

await addDoc(collection(db,"news"),{

title,

description,

video,

image,

createdAt:new Date()

});

document.getElementById("message").innerHTML="✅ News Published Successfully!";

document.getElementById("title").value="";

document.getElementById("description").value="";

document.getElementById("video").value="";

document.getElementById("imageFile").value="";

});

</script>

</body>
</html>
