<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latest News - CJ Entertainment</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>📰 CJ Entertainment</h1>
<p>Latest Celebrity News</p>
</header>

<nav>
<a href="index.html">Home</a>
<a href="news.html">News</a>
<a href="videos.html">Videos</a>
<a href="gallery.html">Gallery</a>
<a href="contact.html">Contact</a>
</nav>

<section id="latestNews">
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAaUKbyTseplQ47ntY5OxXiiN2Pwmdq5uQ",
  authDomain: "cj-entertainment-babc7.firebaseapp.com",
  projectId: "cj-entertainment-babc7",
  storageBucket: "cj-entertainment-babc7.firebasestorage.app",
  messagingSenderId: "724552137010",
  appId: "1:724552137010:web:bd5b4c927e59dd2394ff2b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const newsContainer = document.getElementById("latestNews");

try {
  const snapshot = await getDocs(collection(db, "news"));

  if (snapshot.empty) {
    newsContainer.innerHTML = "<h2>No news available.</h2>";
  } else {
    snapshot.forEach((doc) => {
      const news = doc.data();

      newsContainer.innerHTML += `
        <div class="news">
          ${news.image ? `<img src="${news.image}" style="width:100%;max-width:600px;border-radius:10px;">` : ""}
          <h2>${news.title}</h2>
          <p>${news.description}</p>
          ${news.video ? `<p><a href="${news.video}" target="_blank">▶ Watch Video</a></p>` : ""}
          <hr>
        </div>
      `;
    });
  }

} catch (error) {
  newsContainer.innerHTML = `<h2>Error: ${error.message}</h2>`;
}
</script>

<script src="script.js"></script>

</body>
</html>
